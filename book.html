<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احجز حصتك التجريبية - أكاديمية أمجاد</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#0B1B33; --ink2:#132C56; --gold:#C9A227; --gold-light:#E9CE86;
  --paper:#F8F4E9; --muted:#5B6577;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:Tahoma, Arial, sans-serif;
  background:radial-gradient(ellipse 900px 500px at 75% 0%, rgba(201,162,39,0.16), transparent 60%),
    linear-gradient(160deg, var(--ink) 0%, var(--ink2) 60%, var(--ink) 100%);
  min-height:100vh; color:#fff; padding:24px 16px 60px;
}
.wrap{max-width:480px;margin:0 auto;}
.logo{width:90px;height:90px;border-radius:50%;display:block;margin:0 auto 16px;box-shadow:0 0 0 3px var(--gold);}
h1{text-align:center;font-size:21px;margin-bottom:6px;}
.sub{text-align:center;color:var(--gold-light);font-size:13.5px;margin-bottom:26px;}
.badge{display:block;text-align:center;background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.4);color:var(--gold-light);padding:9px;border-radius:30px;font-size:13px;font-weight:700;margin-bottom:24px;}
label{font-size:13px;font-weight:700;color:var(--gold-light);display:block;margin-bottom:6px;}
input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #2c4066;background:#132C56;color:#fff;font-size:14.5px;font-family:inherit;margin-bottom:16px;}
input::placeholder,textarea::placeholder{color:#8291ac;}
.row2{display:flex;gap:10px;}
.row2>div{flex:1;}
button{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(90deg,var(--gold-light),var(--gold));color:var(--ink);font-weight:800;font-size:16px;cursor:pointer;}
button:disabled{opacity:0.6;}
.msg{text-align:center;margin-top:18px;font-size:13.5px;padding:12px;border-radius:10px;display:none;}
.msg.ok{background:rgba(46,160,90,0.15);color:#8ED1A8;display:block;}
.msg.err{background:rgba(184,57,26,0.15);color:#E9A08A;display:block;}
.success-box{text-align:center;padding:40px 20px;}
.success-box .check{font-size:52px;margin-bottom:16px;}
.wa-btn{display:inline-block;margin-top:20px;background:#25D366;color:#fff;padding:13px 26px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="icon-192.png" alt="أمجاد">
  <h1>أكاديمية أمجاد</h1>
  <div class="sub">احجز حصتك التجريبية المجانية الآن</div>
  <div class="badge">🎁 الحصة الأولى مجانية بالكامل</div>

  <div id="formBox">
    <label>اسم الطالب</label>
    <input id="b_name" placeholder="مثال: عمر أحمد">

    <label>رقم واتساب ولي الأمر</label>
    <input id="b_phone" placeholder="مثال: 201105153906+">

    <label>المادة المطلوبة</label>
    <select id="b_subject">
      <option value="تحفيظ القرآن الكريم">تحفيظ القرآن الكريم</option>
      <option value="تجويد">تجويد</option>
      <option value="تأسيس اللغة العربية">تأسيس اللغة العربية</option>
      <option value="تأسيس اللغة الإنجليزية">تأسيس اللغة الإنجليزية</option>
      <option value="رياضيات">رياضيات</option>
      <option value="علوم">علوم</option>
      <option value="مادة أخرى">مادة أخرى</option>
    </select>

    <div class="row2">
      <div>
        <label>اليوم المفضل</label>
        <select id="b_day">
          <option value="الأحد">الأحد</option>
          <option value="الاثنين">الاثنين</option>
          <option value="الثلاثاء">الثلاثاء</option>
          <option value="الأربعاء">الأربعاء</option>
          <option value="الخميس">الخميس</option>
          <option value="الجمعة">الجمعة</option>
          <option value="السبت">السبت</option>
        </select>
      </div>
      <div>
        <label>الوقت المفضل</label>
        <input type="time" id="b_time" value="17:00">
      </div>
    </div>

    <label>ملاحظات (اختياري)</label>
    <textarea id="b_notes" rows="3" placeholder="أي تفاصيل حابب تقولهالنا..."></textarea>

    <button id="submitBtn">احجز الحصة المجانية</button>
    <div id="msg" class="msg"></div>
  </div>

  <div id="successBox" class="success-box" style="display:none;">
    <div class="check">✅</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:8px;">تم استلام حجزك بنجاح!</div>
    <div style="color:#C9D0DE;font-size:14px;">هنتواصل معاك قريب لتأكيد الموعد</div>
    <a class="wa-btn" id="waConfirmLink" href="#" target="_blank">📲 تأكيد سريع عبر واتساب</a>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://llihyttknmmnfknmjhhv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsaWh5dHRrbm1tbmZrbm1qaGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODU5MjIsImV4cCI6MjEwMTI2MTkyMn0.dNfK_gvRSYaQ7IUO-qrEmodn0wbbEMKmGIu5x2bAS-w';
let supabaseClient = null;
try{ if(window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){}

const ACADEMY_WHATSAPP = '201105153906';

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('b_name').value.trim();
  const phone = document.getElementById('b_phone').value.trim();
  const subject = document.getElementById('b_subject').value;
  const day = document.getElementById('b_day').value;
  const time = document.getElementById('b_time').value;
  const notes = document.getElementById('b_notes').value.trim();
  const msg = document.getElementById('msg');
  msg.className='msg'; msg.style.display='none';

  if(!name || !phone){
    msg.textContent = 'من فضلك اكتب الاسم ورقم الواتساب';
    msg.className = 'msg err';
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'جارِ الحجز...';

  const booking = {
    id: Date.now().toString(),
    name, phone, subject,
    preferred_day: day,
    preferred_time: time,
    notes,
    status: 'pending',
    created_at: new Date().toISOString(),
  };

  try{
    if(!supabaseClient) throw new Error('no client');
    const { error } = await supabaseClient.from('bookings').insert(booking);
    if(error) throw error;

    document.getElementById('formBox').style.display='none';
    document.getElementById('successBox').style.display='block';
    const waMsg = `السلام عليكم، حجزت حصة تجريبية لـ${name} في مادة ${subject}، يوم ${day} الساعة ${time}. تحبوا تأكدوا الميعاد؟`;
    document.getElementById('waConfirmLink').href = `https://wa.me/${ACADEMY_WHATSAPP}?text=${encodeURIComponent(waMsg)}`;
  }catch(e){
    console.error(e);
    msg.textContent = 'حصلت مشكلة في إرسال الحجز، جرب تاني أو تواصل معانا مباشرة على واتساب';
    msg.className = 'msg err';
    btn.disabled = false; btn.textContent = 'احجز الحصة المجانية';
  }
});
</script>
</body>
</html>
