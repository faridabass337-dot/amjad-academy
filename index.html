<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أكاديمية أمجاد | لوحة الإدارة الشاملة</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0B1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#0B1B33; --ink-2:#132C56; --gold:#C9A227; --gold-light:#E9CE86;
  --paper:#F8F4E9; --paper2:#F1EAD6; --muted:#5B6577; --gold-dim:#8A7431;
}
:root.dark{
  --paper:#12161F; --paper2:#1A2030; --muted:#9AA3B5; --ink-text:#E8ECF4;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Tahoma, Arial, sans-serif; background:var(--paper); color:var(--ink-text,#1C2430); padding-bottom:100px; transition:background .2s;}
.dark .card, .dark .student-row, .dark .stats-section, .dark .stat-card, .dark .faq-item, .dark .modal, .dark .t-card, .dark .service-card{background:#1A2030; border-color:#2A3245; color:#E8ECF4;}
.dark .field-input, .dark .search-input{background:#1A2030; border-color:#2A3245; color:#E8ECF4;}
.header{background:linear-gradient(135deg, var(--ink), var(--ink-2)); padding:18px 16px; color:#fff; position:sticky; top:0; z-index:40;}
.header-top{display:flex; justify-content:space-between; align-items:center;}
.brand-name{font-size:18px; font-weight:800;}
.brand-sub{font-size:12px; color:var(--gold-light); margin-top:1px;}
.header-actions{display:flex; align-items:center; gap:6px;}
.icon-btn2{background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:16px; width:34px; height:34px; border-radius:9px; cursor:pointer;}
.save-flag{font-size:10px; color:var(--gold-light); opacity:0; transition:opacity .3s;}
.save-flag.show{opacity:1;}
.cloud-status{font-size:10px; color:#8E97A8;}
.search-bar-wrap{margin-top:12px; position:relative;}
.global-search{width:100%; padding:11px 14px; border-radius:10px; border:none; font-size:13.5px; font-family:inherit; background:rgba(255,255,255,0.12); color:#fff;}
.global-search::placeholder{color:#B9C2D3;}
.search-results{position:absolute; top:44px; right:0; left:0; background:#fff; border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,0.3); max-height:340px; overflow-y:auto; z-index:60;}
.dark .search-results{background:#1A2030;}
.sr-item{padding:12px 14px; border-bottom:1px solid #eee; cursor:pointer; color:#1C2430;}
.dark .sr-item{color:#E8ECF4; border-color:#2A3245;}
.sr-item b{display:block; font-size:14px;}
.sr-item span{font-size:11.5px; color:var(--muted);}
.tabs{margin-top:14px; display:flex; gap:5px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.tab-btn{flex:0 0 auto; padding:9px 9px; border-radius:10px; border:none; cursor:pointer; font-size:11.5px; font-weight:700; background:rgba(255,255,255,0.08); color:#D6DCE8; font-family:inherit; white-space:nowrap;}
.tab-btn.active{background:linear-gradient(90deg,var(--gold-light),var(--gold)); color:var(--ink);}
.container{max-width:640px; margin:0 auto; padding:18px 14px;}
.empty{text-align:center; padding:60px 20px; color:var(--muted);}
.card{background:#fff; border-radius:14px; margin-bottom:12px; border:1.5px solid #E7DFC7; box-shadow:0 8px 24px rgba(11,27,51,0.06); overflow:hidden;}
.card.now{border-color:var(--gold);} .card.soon{border-color:var(--gold-light);} .card.done{opacity:.6;}
.card-row{display:flex; align-items:center; padding:14px 16px; gap:12px;}
.check-circle{width:28px; height:28px; border-radius:50%; flex-shrink:0; cursor:pointer; border:2px solid #D6CCA6; background:transparent; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;}
.check-circle.done{background:var(--gold); border-color:var(--gold);}
.card-info{flex:1; min-width:0; cursor:pointer;}
.card-name{font-weight:700; font-size:15px;}
.card-name.done{text-decoration:line-through;}
.card-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
.card-time{display:flex; align-items:center; gap:4px; font-size:13px; font-weight:700; background:var(--paper2); padding:6px 10px; border-radius:8px; white-space:nowrap;}
.card-time.now{color:#B8391A; background:#FCE9E3;}
.flag-now{background:#FCE9E3; color:#B8391A; font-size:12px; font-weight:700; padding:6px 16px;}
.flag-soon{background:rgba(201,162,39,0.12); color:var(--gold); font-size:12px; font-weight:700; padding:6px 16px;}
.student-row{background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:10px; border:1px solid #E7DFC7; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.student-row .info{flex:1; cursor:pointer;}
.student-row .name{font-weight:700; font-size:14.5px;}
.student-row .meta{font-size:12px; color:var(--muted); margin-top:3px;}
.icon-btn{background:none; border:none; cursor:pointer; color:#B8391A; padding:4px; font-size:15px;}
.btn-outline{font-size:12px; padding:6px 12px; border-radius:7px; border:1px solid var(--gold); background:transparent; color:var(--gold); font-weight:700; cursor:pointer; font-family:inherit;}
.status-badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;}
.status-active{background:#E3F2E9; color:#1F7A4D;} .status-new{background:rgba(201,162,39,0.15); color:var(--gold-dim);} .status-paused{background:#F3E4E4; color:#B8391A;}
.search-input{width:100%; padding:11px 14px; border-radius:10px; border:1px solid #E0DAC8; margin-bottom:12px; font-size:13.5px; font-family:inherit;}
.fab{position:fixed; bottom:22px; left:22px; width:54px; height:54px; border-radius:50%; background:linear-gradient(135deg,var(--gold-light),var(--gold)); border:none; box-shadow:0 10px 28px rgba(201,162,39,0.45); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink); z-index:20;}
.modal-overlay{position:fixed; inset:0; background:rgba(11,27,51,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:80;}
.modal{background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:480px; padding:20px; max-height:88vh; overflow-y:auto;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-title{font-weight:800; font-size:16px;}
.close-btn{background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer;}
.field-label{font-size:12px; font-weight:700; color:var(--muted); display:block; margin-bottom:5px; margin-top:10px;}
.field-input{width:100%; padding:10px 12px; border-radius:9px; border:1px solid #E0DAC8; font-size:13.5px; font-family:inherit;}
.field-row{display:flex; gap:8px;} .field-row>div{flex:1;}
.submit-btn{width:100%; padding:13px; border-radius:10px; border:none; cursor:pointer; background:linear-gradient(90deg,var(--gold-light),var(--gold)); color:var(--ink); font-weight:800; font-size:14px; margin-top:16px; font-family:inherit;}
.section-title{font-size:12px; font-weight:800; margin:16px 0 6px; padding-top:12px; border-top:1px solid #F0EAD6; color:var(--ink-text,#1C2430);}
.section-title:first-of-type{border-top:none; padding-top:0; margin-top:0;}
.add-row-btn{width:100%; padding:9px; border-radius:8px; border:1.5px dashed var(--gold); background:rgba(201,162,39,0.06); color:var(--gold-dim); font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; margin:8px 0;}
.row-remove{width:32px; height:32px; flex-shrink:0; border-radius:8px; border:1px solid #E7C9C9; background:#FCE9E3; color:#B8391A; font-size:14px; cursor:pointer;}
.schedule-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
.schedule-row select, .schedule-row input{flex:1; padding:9px; border-radius:8px; border:1px solid #E0DAC8; font-size:13px; font-family:inherit;}
.custom-field-row{display:flex; gap:6px; margin-bottom:6px;}
.custom-field-row input{flex:1; padding:9px; border-radius:8px; border:1px solid #E0DAC8; font-size:13px; font-family:inherit;}
.toast{position:fixed; bottom:90px; right:50%; transform:translateX(50%); background:var(--ink); color:var(--gold-light); padding:9px 18px; border-radius:20px; font-size:12.5px; opacity:0; transition:opacity .3s; z-index:90;}
.toast.show{opacity:1;}
.schedule-pill{display:inline-block; font-size:11px; background:var(--paper2); padding:3px 8px; border-radius:20px; margin:2px 3px 2px 0; font-weight:600;}
/* profile page */
.profile-header{background:linear-gradient(135deg,var(--ink),var(--ink-2)); color:#fff; padding:24px 18px; border-radius:0 0 20px 20px; margin:-18px -14px 16px;}
.profile-back{background:none; border:none; color:#fff; font-size:14px; cursor:pointer; margin-bottom:14px; font-family:inherit;}
.profile-top{display:flex; align-items:center; gap:14px;}
.profile-photo{width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer;}
.profile-name{font-size:19px; font-weight:800;}
.profile-meta{font-size:12.5px; color:#C9D0DE; margin-top:3px;}
.profile-actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
.profile-action-btn{flex:1; min-width:90px; background:rgba(255,255,255,0.1); border:1px solid rgba(201,162,39,0.4); color:#fff; padding:8px; border-radius:9px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit; text-align:center;}
.package-card{background:#fff; border:1.5px solid #E7DFC7; border-radius:14px; padding:16px; margin-bottom:14px;}
.package-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
.package-title{font-size:15px; font-weight:800;}
.package-sub{font-size:12px; color:var(--muted); margin-top:2px;}
.pay-badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;}
.pay-paid{background:#E3F2E9; color:#1F7A4D;} .pay-unpaid{background:#F3E4E4; color:#B8391A;}
.progress-bar{height:8px; background:var(--paper2); border-radius:6px; overflow:hidden; margin:10px 0;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold-light),var(--gold));}
.fin-box{background:var(--card,#fff);border:1px dashed var(--gold);border-radius:10px;padding:10px;margin:8px 0;font-size:12.5px;}
.fin-sum{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:6px;} .fin-rem{color:#B8391A;font-weight:700;} .fin-ok{color:#1F7A4D;font-weight:700;}
.pay-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 0;border-top:1px solid #E0DAC8;font-size:12px;} .pay-row.rev{opacity:.5;text-decoration:line-through;}
.pay-badge.pay-part{background:#FFF1D6;color:#9A6A00;}
.session-list{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
.session-chip{width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; cursor:pointer; border:1.5px solid #E0DAC8; background:#fff;}
.session-chip.attended{background:#1F7A4D; color:#fff; border-color:#1F7A4D;}
.session-chip.absent{background:#B8391A; color:#fff; border-color:#B8391A;}
.package-footer{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.renew-warning{margin-top:10px; background:rgba(201,162,39,0.12); color:var(--gold-dim); font-size:12px; font-weight:700; padding:8px 12px; border-radius:8px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:10px;}
.cal-day{aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; background:var(--paper2); color:var(--muted);}
.cal-day.attended{background:#3FA66A; color:#fff;}
.cal-day.absent{background:#C24A3A; color:#fff;}
.cal-day.empty{background:transparent;}
.cal-legend{display:flex; gap:14px; margin-top:8px; font-size:11px; color:var(--muted);}
.cal-legend span{display:inline-flex; align-items:center; gap:4px;}
.cal-dot{width:10px; height:10px; border-radius:3px; display:inline-block;}
.salary-banner{background:linear-gradient(90deg,var(--gold-light),var(--gold)); color:var(--ink); padding:12px 16px; border-radius:12px; font-size:13px; font-weight:700; margin-bottom:14px;}
.compare-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #F0EAD6; font-size:13.5px;}
.compare-up{color:#1F7A4D; font-weight:800;}
.compare-down{color:#B8391A; font-weight:800;}
.mini-btn{font-size:11.5px; padding:7px 12px; border-radius:8px; border:1px solid var(--gold); background:transparent; color:var(--gold-dim); font-weight:700; cursor:pointer; font-family:inherit;}
.mini-btn.filled{background:var(--gold); color:#fff; border-color:var(--gold);}
.receipt-thumb{width:52px; height:52px; border-radius:8px; object-fit:cover; border:1px solid #E0DAC8;}
@media print{
  .header, .fab, .tabs, .profile-action-btn, .icon-btn, .btn-outline, .mini-btn{display:none !important;}
  body{padding-bottom:0;}
  body.printing-backup .container, body.printing-backup .header{display:none !important;}
  body.printing-backup #fullBackupPrint{display:block !important;}
}
#fullBackupPrint{padding:20px;color:#000;background:#fff;direction:rtl;}
</style>
</head>
<body>

<div id="lockScreen" style="position:fixed;inset:0;background:linear-gradient(135deg,#0B1B33,#132C56);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;">
  <img src="icon-192.png" style="width:90px;height:90px;border-radius:50%;box-shadow:0 0 0 3px #C9A227;margin-bottom:20px;">
  <div style="color:#fff;font-size:19px;font-weight:800;margin-bottom:6px;">أكاديمية أمجاد</div>
  <div style="color:#C9D0DE;font-size:13px;margin-bottom:24px;">سجّل دخولك للمتابعة</div>
  <input type="email" id="loginEmail" placeholder="الإيميل" autocomplete="username" style="width:100%;max-width:280px;padding:14px;border-radius:10px;border:1px solid #3a4d70;background:#132C56;color:#fff;font-size:15px;text-align:center;margin-bottom:10px;">
  <input type="password" id="loginPassInput" placeholder="كلمة السر" autocomplete="current-password" style="width:100%;max-width:280px;padding:14px;border-radius:10px;border:1px solid #3a4d70;background:#132C56;color:#fff;font-size:15px;text-align:center;margin-bottom:14px;">
  <button id="loginSubmitBtn" style="width:100%;max-width:280px;padding:14px;border-radius:10px;border:none;background:linear-gradient(90deg,#E9CE86,#C9A227);color:#0B1B33;font-weight:800;font-size:15px;cursor:pointer;">دخول</button>
  <div id="lockError" style="color:#E9A08A;font-size:12.5px;margin-top:12px;display:none;"></div>
</div>

<div id="notifBanner" style="display:none; position:fixed; top:0; right:0; left:0; background:var(--gold); color:var(--ink); text-align:center; padding:9px; font-size:12.5px; font-weight:700; cursor:pointer; z-index:60;">🔔 فعّل الإشعارات — دوس هنا</div>

<div class="header">
  <div class="header-top">
    <div>
      <div class="brand-name">أكاديمية أمجاد</div>
      <div class="brand-sub" id="cloudStatus">☁️ ...</div>
    </div>
    <div class="header-actions">
      <div id="saveFlag" class="save-flag">✓ حُفظ</div>
      <button class="icon-btn2" id="darkToggle">🌙</button>
      <button class="icon-btn2" id="settingsBtn">⚙️</button>
    </div>
  </div>
  <div class="search-bar-wrap">
    <input class="global-search" id="globalSearch" placeholder="🔍 دور على طالب أو معلم من أي مكان...">
    <div id="searchResults"></div>
  </div>
  <div class="tabs" id="tabsBar">
    <button class="tab-btn active" data-tab="today" id="todayTabBtn"></button>
    <button class="tab-btn" data-tab="students">👥 الطلاب</button>
    <button class="tab-btn" data-tab="finance">💰 المالية</button>
    <button class="tab-btn" data-tab="bookings" id="bookingsTabBtn">📅 الحجوزات</button>
    <button class="tab-btn" id="moreTabBtn">⋯ المزيد</button>
  </div>
  <div id="moreMenuRoot"></div>
</div>

<div class="container" id="container"></div>
<button class="fab" id="fabAdd">+</button>
<div id="modalRoot"></div>
<div id="settingsMenuRoot"></div>
<div id="fullBackupPrint" style="display:none;"></div>
<input type="file" id="importFile" accept="application/json" style="display:none;">
<input type="file" id="photoInput" accept="image/*" style="display:none;">
<div id="toast" class="toast"></div>

<script>
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAY_KEYS=['sun','mon','tue','wed','thu','fri','sat'];
const CURRENCIES=['EGP','SAR','AED','KWD','QAR','BHD','OMR','USD'];
const CURRENCY_LABELS={EGP:'جنيه مصري',SAR:'ريال سعودي',AED:'درهم إماراتي',KWD:'دينار كويتي',QAR:'ريال قطري',BHD:'دينار بحريني',OMR:'ريال عماني',USD:'دولار'};

function todayKey(){return DAY_KEYS[new Date().getDay()];}
function todayLabel(){return DAYS[new Date().getDay()];}
function dateStr(){return new Date().toISOString().slice(0,10);}
function toMinutes(t){const [h,m]=t.split(':').map(Number);return h*60+m;}
function escapeHtml(str){const d=document.createElement('div');d.textContent=str||'';return d.innerHTML;}
function uid(){return Date.now().toString()+Math.random().toString(36).slice(2,6);}

// ---------- Supabase ----------
const SUPABASE_URL='https://llihyttknmmnfknmjhhv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsaWh5dHRrbm1tbmZrbm1qaGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODU5MjIsImV4cCI6MjEwMTI2MTkyMn0.dNfK_gvRSYaQ7IUO-qrEmodn0wbbEMKmGIu5x2bAS-w';
let supabaseClient=null;
try{ if(window.supabase && window.supabase.createClient){ supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); } }catch(e){console.error(e);}
let cloudOnline=false;

let students=JSON.parse(localStorage.getItem('amjad_students')||'[]');
let transactions=JSON.parse(localStorage.getItem('amjad_transactions')||'[]');
let teachers=JSON.parse(localStorage.getItem('amjad_teachers')||'[]');
let bookings=JSON.parse(localStorage.getItem('amjad_bookings')||'[]');
let seenBookingIds=new Set(JSON.parse(localStorage.getItem('amjad_seen_bookings')||'null')||bookings.map(b=>b.id));
let notes=JSON.parse(localStorage.getItem('amjad_notes_'+dateStr())||'{}');
let completed=JSON.parse(localStorage.getItem('amjad_completed_'+dateStr())||'{}');

function migrateStudent(s){
  if(!s.schedule||!Array.isArray(s.schedule)) s.schedule=(s.day&&s.time)?[{day:s.day,time:s.time}]:[];
  if(!s.customFields||!Array.isArray(s.customFields)) s.customFields=[];
  if(!s.packages||!Array.isArray(s.packages)) s.packages=[];
  if(!s.photo) s.photo='';
  return s;
}
students=students.map(migrateStudent);

// dark mode
if(localStorage.getItem('amjad_dark')==='1') document.documentElement.classList.add('dark');
document.getElementById('darkToggle').addEventListener('click',()=>{
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('amjad_dark', document.documentElement.classList.contains('dark')?'1':'0');
});

function saveStudents(){ localStorage.setItem('amjad_students',JSON.stringify(students)); flashSave(); syncStudentsToCloud(); }
function saveTransactions(){ localStorage.setItem('amjad_transactions',JSON.stringify(transactions)); flashSave(); syncTransactionsToCloud(); }
function saveTeachers(){ localStorage.setItem('amjad_teachers',JSON.stringify(teachers)); flashSave(); syncTeachersToCloud(); }
function saveCompleted(){ localStorage.setItem('amjad_completed_'+dateStr(),JSON.stringify(completed)); }
function saveNotes(){ localStorage.setItem('amjad_notes_'+dateStr(),JSON.stringify(notes)); flashSave(); }
function flashSave(){ const el=document.getElementById('saveFlag'); el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1200); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function setKnown(k,ids){ try{ localStorage.setItem('amjad_known_'+k,JSON.stringify(ids)); }catch(e){} }
let lastSyncErr='';
function setSyncErr(where,e){ lastSyncErr=where+': '+((e&&(e.message||e.details||e.code))||String(e)); try{localStorage.setItem('amjad_last_sync_err',lastSyncErr);}catch(x){} }
function updateCloudStatus(){ const el=document.getElementById('cloudStatus'); if(!el)return; el.textContent=cloudOnline?'☁️ متصل':('⚠️ غير متصل (محلي)'+(lastSyncErr?' — '+lastSyncErr.slice(0,90):'')); el.style.color=cloudOnline?'#8ED1A8':'#E9A08A'; }


/* حذف آمن: لا يُحذف شيء من السيرفر إلا لو المستخدم حذفه صراحةً. الطلاب والمعلمون حذف ناعم (deleted_at) */
function queueDelete(table,id){ try{ const k='amjad_pdel_'+table; const a=JSON.parse(localStorage.getItem(k)||'[]'); if(!a.includes(id)) a.push(id); localStorage.setItem(k,JSON.stringify(a)); }catch(e){} }
async function flushDeletes(table,soft){
  const k='amjad_pdel_'+table; let ids=[]; try{ ids=JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){}
  if(!ids.length) return;
  const q = soft ? supabaseClient.from(table).update({deleted_at:new Date().toISOString()}).in('id',ids)
                 : supabaseClient.from(table).delete().in('id',ids);
  const {error}=await q;
  if(error){ console.error('delete flush failed',table,error); return; }
  localStorage.removeItem(k);
}
async function syncStudentsToCloud(){
  if(!supabaseClient){cloudOnline=false;updateCloudStatus();return;}
  try{
    if(students.length){ const {error}=await supabaseClient.from('students').upsert(students,{onConflict:'id'}); if(error)throw error; }
    await flushDeletes('students',true);
    cloudOnline=true;
  }catch(e){ cloudOnline=false; setSyncErr('sync students',e); console.error('sync students failed, remote untouched',e); }
  updateCloudStatus();
}

async function loadFromCloud(){
  if(!supabaseClient){cloudOnline=false;updateCloudStatus();render();return;}
  try{
    const [sr,tr,tcr,br]=await Promise.all([
      supabaseClient.rpc('get_students'),
      supabaseClient.from('transactions').select('*'),
      supabaseClient.rpc('get_teachers'),
      supabaseClient.from('bookings').select('*'),
    ]);
    if(sr.error) throw sr.error;
    if(tr.error) throw tr.error;
    const cloudStudents=(sr.data||[]).map(migrateStudent);
    const cloudTx=tr.data||[];
    const cloudTeachers=tcr.error?null:(tcr.data||[]);
    const cloudBookings=br.error?null:(br.data||[]);
    let needsResync=false;
    const studentsLostData = students.some(localS=>{
      const cloudS = cloudStudents.find(cs=>cs.id===localS.id);
      if(!cloudS) return true;
      const localPkgCount = (localS.packages||[]).length;
      const cloudPkgCount = (cloudS.packages||[]).length;
      return cloudPkgCount < localPkgCount;
    });
    // Non-admin users only receive their assigned students, so a shorter list is correct, not data loss.
    if(!isAdmin()){
      students=cloudStudents; localStorage.setItem('amjad_students',JSON.stringify(students)); setKnown('students',students.map(s=>s.id));
    } else if(cloudStudents.length<students.length || studentsLostData){needsResync=true;} else {students=cloudStudents; localStorage.setItem('amjad_students',JSON.stringify(students)); setKnown('students',students.map(s=>s.id));}
    // Non-admin users are DB-restricted from reading financial tables (transactions) — a shorter/empty
    // result for them is correct permission filtering, not data loss, so never fall back to stale local cache.
    if(!isAdmin()){
      transactions=cloudTx; localStorage.setItem('amjad_transactions',JSON.stringify(transactions)); setKnown('transactions',[]);
    } else if(cloudTx.length<transactions.length){needsResync=true;} else {transactions=cloudTx; localStorage.setItem('amjad_transactions',JSON.stringify(transactions)); setKnown('transactions',transactions.map(t=>t.id));}
    if(cloudTeachers!==null){
      if(!isAdmin()){ teachers=cloudTeachers; localStorage.setItem('amjad_teachers',JSON.stringify(teachers)); setKnown('teachers',teachers.map(t=>t.id)); }
      else if(cloudTeachers.length<teachers.length){needsResync=true;} else {teachers=cloudTeachers; localStorage.setItem('amjad_teachers',JSON.stringify(teachers)); setKnown('teachers',teachers.map(t=>t.id));}
    }
    if(cloudBookings!==null){ if(cloudBookings.length<bookings.length){needsResync=true;} else {bookings=cloudBookings; localStorage.setItem('amjad_bookings',JSON.stringify(bookings)); setKnown('bookings',bookings.map(b=>b.id));} }
    cloudOnline=true;
    if(needsResync && isAdmin()){ await Promise.all([syncStudentsToCloud(),syncTransactionsToCloud(),syncTeachersToCloud(),syncBookingsToCloud()]); }
    mirrorDirty();
  }catch(e){ cloudOnline=false; setSyncErr('cloud load',e); console.error('cloud load failed',e); }
  updateCloudStatus();
  render();
}

// ---------- image resize helper ----------
function resizeImage(file, maxW, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, maxW/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.7));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// ---------- TODAY ----------
function renderToday(c){
  const sessions=[];
  students.forEach(s=>{ (s.schedule||[]).forEach(slot=>{ if(slot.day===todayKey()) sessions.push({student:s,time:slot.time,key:s.id+'_'+slot.time}); }); });
  sessions.sort((a,b)=>a.time.localeCompare(b.time));
  if(sessions.length===0){ c.innerHTML='<div class="empty">📅<br><br>مفيش حصص مجدولة النهاردة</div>'; return; }
  const now=new Date().getHours()*60+new Date().getMinutes();
  sessions.forEach(sess=>{
    const s=sess.student, key=sess.key;
    const isDone=!!completed[key];
    const diff=toMinutes(sess.time)-now;
    const notifyBefore=Number(s.notifyBefore||10);
    const isSoon=diff>0&&diff<=notifyBefore;
    const isNow=diff<=0&&diff>-60&&!isDone;
    const card=document.createElement('div');
    card.className='card'+(isNow?' now':isSoon?' soon':'')+(isDone?' done':'');
    const activePkg=(s.packages||[]).find(p=>p.active&&p.whatsappGroup);
    card.innerHTML=`
      <div class="card-row">
        <button class="check-circle ${isDone?'done':''}" data-check="${key}">${isDone?'✓':''}</button>
        <div class="card-info" data-open="${s.id}">
          <div class="card-name ${isDone?'done':''}">${escapeHtml(s.name)}</div>
          <div class="card-sub">${escapeHtml(s.subject||'بدون مادة محددة')}</div>
        </div>
        <div class="card-time ${isNow?'now':''}">⏰ ${sess.time}</div>
      </div>
      ${isNow?'<div class="flag-now">🔴 موعد الحصة دلوقتي</div>':''}
      ${isSoon&&!isNow?`<div class="flag-soon">🔔 الحصة قربت — بعد ${diff} دقيقة</div>`:''}
      ${isSoon&&!isNow&&activePkg?`<div style="padding:0 16px 12px;"><button class="mini-btn filled" data-group-remind="${s.id}" data-diff="${diff}">📲 رسالة تذكير للجروب</button></div>`:''}
    `;
    c.appendChild(card);
    const flagKey=key+'_'+dateStr();
    if(isSoon&&!notifiedFlags[flagKey]){ notifiedFlags[flagKey]=true; fireNotification('حصة قربت 🔔',`${s.name} بعد ${diff} دقيقة${activePkg?' — رسالة الجروب جاهزة':''}`); }
  });
  c.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click',()=>{ completed[b.dataset.check]=!completed[b.dataset.check]; saveCompleted(); render(); }));
  c.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openProfile(b.dataset.open)));
  c.querySelectorAll('[data-group-remind]').forEach(b=>b.addEventListener('click',()=>{
    const s=students.find(x=>x.id===b.dataset.groupRemind);
    const pkg=(s.packages||[]).find(p=>p.active&&p.whatsappGroup);
    if(!pkg) return;
    const msg=`تذكير من أكاديمية أمجاد 🌙\nحصة "${pkg.subject}" لـ${s.name} هتبدأ بعد ${b.dataset.diff} دقيقة.\nالرجاء الاستعداد 📚`;
    window.open(pkg.whatsappGroup,'_blank');
    if(navigator.clipboard){ navigator.clipboard.writeText(msg).catch(()=>{}); }
    toast('اتنسخت الرسالة — الصقها في الجروب وابعتها');
  }));
}

  searchBar.addEventListener('input',e=>{ searchQuery=e.target.value; render(); });
  c.appendChild(searchBar);
  const chips=document.createElement('div');
  chips.style.display='flex'; chips.style.gap='8px'; chips.style.marginBottom='12px'; chips.style.flexWrap='wrap';
  const filters=[['all','الكل'],['new','جديد'],['active','نشط'],['paused','متوقف']];
  chips.innerHTML=filters.map(([k,l])=>`<button class="btn-outline" style="${statusFilter===k?'background:var(--ink);color:#fff;border-color:var(--ink);':''}" data-filter="${k}">${l}</button>`).join('');
  c.appendChild(chips);
  chips.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{ statusFilter=b.dataset.filter; render(); }));

  let filtered=students.filter(s=>{
    const ms=!searchQuery||s.name.includes(searchQuery)||(s.parentName||'').includes(searchQuery);
    const mst=statusFilter==='all'||s.status===statusFilter;
    return ms&&mst;
  });
  if(filtered.length===0){ const e=document.createElement('div'); e.className='empty'; e.innerHTML=students.length===0?'👤<br><br>لسه معملتش أي طالب.. دوس + لإضافة أول طالب':'🔍<br><br>مفيش نتايج'; c.appendChild(e); return; }
  const statusLabel={new:'جديد',active:'نشط',paused:'متوقف'};
  const statusClass={new:'status-new',active:'status-active',paused:'status-paused'};
  filtered.forEach(s=>{
    const row=document.createElement('div');
    row.className='student-row';
    const schedHtml=(s.schedule&&s.schedule.length)?s.schedule.map(sl=>`<span class="schedule-pill">${DAYS[DAY_KEYS.indexOf(sl.day)]} ${sl.time}</span>`).join(''):'';
    const pkgCount=(s.packages||[]).filter(p=>p.active).length;

        <div class="name">${escapeHtml(s.name)} ${s.status?`<span class="status-badge ${statusClass[s.status]||''}">${statusLabel[s.status]||''}</span>`:''}</div>
        <div class="meta">${escapeHtml(s.subject||'')}</div>
        <div>${schedHtml}</div>

      <button class="btn-outline" data-edit="${s.id}">تعديل سريع</button>
      <button class="icon-btn" data-del="${s.id}">🗑</button>
    `;

function closeForm(){ document.getElementById('modalRoot').innerHTML=''; editingId=null; }
function submitForm(){
  const name=document.getElementById('f_name').value.trim();
  const subject=document.getElementById('f_subject').value.trim();
  const notifyBefore=document.getElementById('f_notify').value;
  const parentName=document.getElementById('f_parentName').value.trim();
  const parentPhone=document.getElementById('f_parentPhone').value.trim();
  const status=document.getElementById('f_status').value;
  const permanentNotes=document.getElementById('f_permanentNotes').value.trim();
  const schedule=[...document.querySelectorAll('#scheduleRows .schedule-row')].map(r=>({day:r.querySelector('.sched-day').value,time:r.querySelector('.sched-time').value})).filter(sl=>sl.time);

  if(!name||schedule.length===0) return;
  const extra={name,subject,schedule,notifyBefore,parentName,parentPhone,status,permanentNotes,customFields};
  if(editingId){ students=students.map(s=>s.id===editingId?{...s,...extra,updatedAt:new Date().toISOString()}:s); }
  else{ students.push({id:uid(),...extra,packages:[],photo:'',createdAt:new Date().toISOString()}); }
  saveStudents(); closeForm(); render(); toast('تم الحفظ بنجاح');
}

// ---------- FINANCE (partial payments, discounts, mirror to relational tables) ----------
const PAY_METHODS=['نقدي','تحويل بنكي','فودافون كاش','إنستا باي','بطاقة','أخرى'];
function pkgCur(p){ return (p.currency||'EGP'); }
function pkgRate(p){ const a=Number(p.amount)||0, e=Number(p.amountEGP)||0; return (pkgCur(p)!=='EGP'&&a>0&&e>0)?e/a:1; }
function r2(n){ return Math.round((Number(n)||0)*100)/100; }
function getAcademyInfo(){ try{ return JSON.parse(localStorage.getItem('amjad_academy_info')||'{}'); }catch(e){ return {}; } }
function pkgFin(p){
  const total=Number(p.amountEGP)||0;
  const disc=Math.min(Number(p.discount)||0,total);
  const net=Math.max(total-disc,0);
  let paid;
  let pending=0;
  if(Array.isArray(p.payments)){
    paid=p.payments.filter(x=>!x.reversed&&x.status!=='pending').reduce((a,x)=>a+(Number(x.amount)||0),0);
    pending=p.payments.filter(x=>!x.reversed&&x.status==='pending').reduce((a,x)=>a+(Number(x.amount)||0),0);
  } else paid=p.paid?net:0;
  const remaining=Math.max(Math.round((net-paid)*100)/100,0);
  let status='unpaid';
  if(net>0){ status=remaining<=0?'paid':(paid>0?'partial':'unpaid'); } else if(p.paid){ status='paid'; }
  return {total,disc,net,paid,pending:r2(pending),remaining,status};
}
function finBadge(p){
  const f=pkgFin(p);
  const pend=f.pending>0?'<span class="pay-badge pay-part" style="margin-inline-start:4px;">⏳ مؤجل</span>':'';
  return (f.status==='paid'?'<span class="pay-badge pay-paid">✓ مدفوع بالكامل</span>'
        :f.status==='partial'?'<span class="pay-badge pay-part">◐ دفعة جزئية</span>'
        :'<span class="pay-badge pay-unpaid">غير مدفوع</span>')+pend;
}
function fmtEGP(n){ return Number(n||0).toLocaleString('ar')+' ج.م'; }
function finBlock(p){
  const f=pkgFin(p);
  const pays=Array.isArray(p.payments)?p.payments:[];
  const legacy=!Array.isArray(p.payments)&&p.paid;
  return `<div class="fin-box">
    <div class="fin-sum">
      <span>الإجمالي: <b>${fmtEGP(f.total)}</b></span>
      ${f.disc?`<span>خصم: <b>${fmtEGP(f.disc)}</b>${p.discountReason?' ('+escapeHtml(p.discountReason)+')':''}</span>`:''}
      <span>مؤكد: <b>${fmtEGP(f.paid)}</b></span>
      ${f.pending>0?`<span style="color:#9A6A00;">⏳ مؤجل: <b>${fmtEGP(f.pending)}</b></span>`:''}
      <span class="${f.remaining>0?'fin-rem':'fin-ok'}">المتبقي: ${fmtEGP(f.remaining)}</span>
    </div>
    ${legacy?`<div class="pay-row">مدفوع بالكامل (مسجّل قبل نظام الدفعات) <button class="mini-btn" data-legacy-unpay="${p.id}">إلغاء الدفع</button></div>`:''}
    ${pays.map(x=>`<div class="pay-row ${x.reversed?'rev':''}">
      <span>${escapeHtml(x.date||'')}</span><span>${escapeHtml(x.method||'')}</span><b>${(x.origCurrency&&x.origCurrency!=='EGP')?escapeHtml(String(x.origAmount))+' '+escapeHtml(x.origCurrency)+' ('+fmtEGP(x.amount)+')':fmtEGP(x.amount)}</b>
      <span>${escapeHtml(x.invoiceNumber||'')}</span>${x.note?`<span>${escapeHtml(x.note)}</span>`:''}
      ${x.reversed?'<span>(ملغاة)</span>':x.status==='pending'?`<span style="color:#9A6A00;">⏳ مؤجلة</span><button class="mini-btn" data-inv-pay="${p.id}|${x.id}">🧾 إيصال</button><button class="mini-btn filled" data-pend-confirm="${p.id}|${x.id}">✅ تأكيد الاستلام</button><button class="mini-btn" data-pend-cancel="${p.id}|${x.id}" style="color:#B8391A;border-color:#E7C9C9;">إلغاء</button>`:`<button class="mini-btn" data-inv-pay="${p.id}|${x.id}">🧾 فاتورة</button><button class="mini-btn" data-rev-pay="${p.id}|${x.id}" style="color:#B8391A;border-color:#E7C9C9;">إلغاء</button>`}
    </div>`).join('')}
  </div>`;
}
function markFinDirty(pid){ try{ const a=JSON.parse(localStorage.getItem('amjad_fin_dirty')||'[]'); if(!a.includes(pid)) a.push(pid); localStorage.setItem('amjad_fin_dirty',JSON.stringify(a)); }catch(e){} }
async function mirrorPackage(st,p){
  const f=pkgFin(p);
  const me=currentUser&&currentUser.id||null;
  let teacher=p.teacherId||null;
  let r=await supabaseClient.from('subscriptions').upsert({id:p.id,student_id:st.id,subject:p.subject,teacher_id:teacher,whatsapp_group:p.whatsappGroup||null,total_sessions:(p.sessions||[]).length,created_by:me},{onConflict:'id'});
  if(r.error&&teacher){ r=await supabaseClient.from('subscriptions').upsert({id:p.id,student_id:st.id,subject:p.subject,teacher_id:null,whatsapp_group:p.whatsappGroup||null,total_sessions:(p.sessions||[]).length,created_by:me},{onConflict:'id'}); }
  if(r.error) throw r.error;
  r=await supabaseClient.from('subscription_finance').upsert({subscription_id:p.id,total_amount:Number(p.amount)||0,currency:p.currency||'EGP',total_amount_egp:f.total,discount_amount:f.disc,discount_reason:p.discountReason||null,paid_total_egp:f.paid},{onConflict:'subscription_id'});
  if(r.error) throw r.error;
  const sess=(p.sessions||[]).map((ss,i)=>({id:p.id+'_'+(i+1),subscription_id:p.id,seq:i+1,date:ss.date||null,status:ss.status||'pending',makeup:!!ss.makeup}));
  if(sess.length){ r=await supabaseClient.from('subscription_sessions').upsert(sess,{onConflict:'id'}); if(r.error) throw r.error; }
  const pays=(Array.isArray(p.payments)?p.payments:[]).map(x=>({id:x.id,subscription_id:p.id,amount:Number(x.origAmount!=null?x.origAmount:x.amount)||0,currency:x.origCurrency||'EGP',amount_egp:Number(x.amount)||0,method:x.method||null,note:x.note||null,invoice_number:x.invoiceNumber||null,paid_at:x.date||null,created_by:me,reversed_at:x.reversed?(x.reversedAt||new Date().toISOString()):null,reversed_by:x.reversed?me:null,status:x.status||'confirmed',confirmed_at:x.confirmedAt||null,confirmed_by:x.confirmedAt?me:null}));
  if(pays.length){ r=await supabaseClient.from('payments').upsert(pays,{onConflict:'id'}); if(r.error) throw r.error; }
}
async function mirrorDirty(){
  if(!supabaseClient||!isAdmin()) return;
  let ids=[]; try{ ids=JSON.parse(localStorage.getItem('amjad_fin_dirty')||'[]'); }catch(e){}
  if(!ids.length) return;
  const left=[];
  for(const id of ids){
    let st=null,pk=null; for(const x of students){ const f=(x.packages||[]).find(q=>q.id===id); if(f){st=x;pk=f;break;} }
    if(!pk) continue;
    try{ await mirrorPackage(st,pk); }catch(e){ console.error('finance mirror failed',id,e); left.push(id); }
  }
  localStorage.setItem('amjad_fin_dirty',JSON.stringify(left));
}
function openPriceForm(studentId,pkgId){
  const st=students.find(x=>x.id===studentId); const pkg=st.packages.find(p=>p.id===pkgId);
  const activePays=(Array.isArray(pkg.payments)?pkg.payments:[]).filter(x=>!x.reversed);

  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-overlay" id="overlay"><div class="modal">
    <div class="modal-head"><div class="modal-title">سعر الباقة — ${escapeHtml(pkg.subject)}</div><button class="close-btn" id="closeModal">✕</button></div>
    <label class="field-label">عملة العميل</label>
    <select class="field-input" id="pr_cur" ${lockCur?'disabled':''}>${CURRENCIES.map(c=>`<option value="${c}" ${c===pkgCur(pkg)?'selected':''}>${c}</option>`).join('')}</select>
    ${lockCur?'<div class="package-sub">العملة مقفولة لأن فيه دفعات مسجلة. ألغِ الدفعات أولًا لو عايز تغيّرها.</div>':''}
    <label class="field-label" id="pr_origLbl">سعر الباقة بعملة العميل</label>
    <input type="number" step="any" class="field-input" id="pr_orig" value="${escapeHtml(pkg.amount||'')}">
    <label class="field-label">المعادل بالجنيه المصري</label>
    <input type="number" step="any" class="field-input" id="pr_egp" value="${escapeHtml(pkg.amountEGP||'')}">
    <button class="submit-btn" id="submitPrice">حفظ السعر</button></div></div>`;
  document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeForm();});
  document.getElementById('closeModal').addEventListener('click',closeForm);
  const curEl=document.getElementById('pr_cur'), origEl=document.getElementById('pr_orig'), egpEl=document.getElementById('pr_egp');
  const sync=()=>{ if(curEl.value==='EGP'){ egpEl.value=origEl.value; egpEl.disabled=true; } else { egpEl.disabled=false; } };
  curEl.addEventListener('change',sync); origEl.addEventListener('input',()=>{ if(curEl.value==='EGP') egpEl.value=origEl.value; }); sync();
  document.getElementById('submitPrice').addEventListener('click',()=>{
    const cur=curEl.value, orig=Number(origEl.value), egp=cur==='EGP'?orig:Number(egpEl.value);
    if(!(orig>=0)||!(egp>=0)){ toast('اكتب أرقامًا صحيحة'); return; }
    if(cur!=='EGP'&&orig>0&&!(egp>0)){ toast('اكتب المعادل بالجنيه'); return; }
    const tmp=Object.assign({},pkg,{amountEGP:egp});
    if(pkgFin(tmp).paid>Math.max(egp-(Number(pkg.discount)||0),0)+0.001){ toast('المدفوع أكبر من السعر الجديد'); return; }
    pkg.currency=cur; pkg.amount=String(orig); pkg.amountEGP=String(egp);
    pkg.paid=pkgFin(pkg).status==='paid';
    saveStudents(); markFinDirty(pkg.id); mirrorDirty(); closeForm(); render(); toast('تم حفظ السعر');
  });
}
function openPaymentForm(studentId,pkgId){
  const st=students.find(x=>x.id===studentId); const pkg=st.packages.find(p=>p.id===pkgId);
  const f=pkgFin(pkg);
  if(f.net<=0){ toast('حدد مبلغ الباقة بالجنيه أولًا (زر "المبلغ")'); return; }
  if(f.remaining<=0){ toast('الباقة مدفوعة بالكامل'); return; }
  const payId=uid(); // ثابت لهذه النافذة: الضغط المتكرر لا يسجل دفعة ثانية
  const cur=pkgCur(pkg), rate=pkgRate(pkg), foreign=cur!=='EGP';
  const avail=r2(Math.max(f.remaining-f.pending,0));
  if(avail<=0){ toast('المتبقي مغطّى بمبالغ مؤجلة — أكّدها أو ألغِها أولًا'); return; }
  const remOrig=r2(avail/rate);
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-overlay" id="overlay"><div class="modal">
    <div class="modal-head"><div class="modal-title">تسجيل دفعة — ${escapeHtml(pkg.subject)}</div><button class="close-btn" id="closeModal">✕</button></div>
    <div class="package-sub">المتاح للتسجيل: <b>${foreign?remOrig+' '+cur+' ('+fmtEGP(avail)+')':fmtEGP(avail)}</b></div>
    <div class="package-sub" style="color:#9A6A00;">⏳ ستُسجّل في المالية المؤجلة، ولا تدخل المالية الفعلية إلا بعد تأكيد الاستلام.</div>
    ${foreign?`<label class="field-label">المبلغ المدفوع بعملة العميل (${cur})</label><input type="number" step="any" class="field-input" id="py_orig" value="${remOrig}">
    <label class="field-label">المعادل بالجنيه المصري (يُحسب تلقائيًا ويمكن تعديله)</label>`:`<label class="field-label">المبلغ (ج.م)</label>`}
    <input type="number" step="any" class="field-input" id="py_amount" value="${avail}">
    <label class="field-label">طريقة الدفع</label><select class="field-input" id="py_method">${PAY_METHODS.map(m=>`<option>${m}</option>`).join('')}</select>
    <label class="field-label">تاريخ الدفع / التحويل</label><input type="date" class="field-input" id="py_date" value="${dateStr()}">
    <label class="field-label">ملاحظة تظهر على الإيصال (اختياري)</label><input class="field-input" id="py_note">
    <button class="submit-btn" id="submitPay">تسجيل في المالية المؤجلة</button></div></div>`;
  document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeForm();});
  document.getElementById('closeModal').addEventListener('click',closeForm);
  if(foreign){
    document.getElementById('py_orig').addEventListener('input',()=>{
      const o=Number(document.getElementById('py_orig').value)||0;
      const egp=(o>=remOrig-0.001)?avail:r2(o*rate);
      document.getElementById('py_amount').value=egp;
    });
  }
  document.getElementById('submitPay').addEventListener('click',e=>{
    e.target.disabled=true;
    const amount=r2(document.getElementById('py_amount').value);
    const origAmount=foreign?r2(document.getElementById('py_orig').value):amount;
    const ok=addPayment(st,pkg,{payId,amount,origAmount,origCurrency:cur,method:document.getElementById('py_method').value,date:document.getElementById('py_date').value||dateStr(),note:document.getElementById('py_note').value.trim()});
    if(ok){ closeForm(); render(); } else { e.target.disabled=false; }
  });
}
function addPayment(st,pkg,{payId,amount,origAmount,origCurrency,method,date,note}){
  if(!Array.isArray(pkg.payments)) pkg.payments=[];
  if(pkg.payments.some(x=>x.id===payId)) return false; // منع التكرار
  const f=pkgFin(pkg);
  if(!(amount>0)||!(origAmount>0)){ toast('اكتب مبلغًا صحيحًا'); return false; }
  if(amount>f.remaining-f.pending+0.001){ toast('المبلغ أكبر من المتاح ('+r2(f.remaining-f.pending)+' ج.م)'); return false; }
  const now=new Date().toISOString(), inv=nextInvoiceNumber();
  const pay={id:payId,amount,origAmount,origCurrency:origCurrency||'EGP',method,date,note,status:'pending',invoiceNumber:inv,createdAt:now,reversed:false};
  pkg.payments.push(pay);
  saveStudents(); markFinDirty(pkg.id); mirrorDirty();
  generateInvoice(st,pkg,inv,pay);
  toast('سُجّلت في المالية المؤجلة وصدر إيصال مبدئي');
  return true;
}
function findPkgById(pkgId){ for(const st of students){ const pk=(st.packages||[]).find(q=>q.id===pkgId); if(pk) return {st,pkg:pk}; } return null; }
function confirmPayment(pkgId,payId){
  const h=findPkgById(pkgId); if(!h) return; const {st,pkg}=h;
  const x=(pkg.payments||[]).find(y=>y.id===payId); if(!x||x.reversed||x.status!=='pending') return;
  const d=prompt('تاريخ استلام المبلغ فعليًا (YYYY-MM-DD)',dateStr()); if(d===null) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.trim())){ toast('صيغة التاريخ غير صحيحة'); return; }
  const f=pkgFin(pkg);
  if(x.amount>f.remaining+0.001){ toast('المبلغ أكبر من المتبقي الحالي، راجع الخصم أو السعر'); return; }
  const inv=x.invoiceNumber||nextInvoiceNumber(), now=new Date().toISOString();
  x.status='confirmed'; x.date=d.trim(); x.confirmedAt=now; x.invoiceNumber=inv;
  pkg.invoiceNumber=inv; pkg.paid=pkgFin(pkg).status==='paid';
  if(!transactions.some(t=>t.id==='pay_'+x.id)){
    transactions.push({id:'pay_'+x.id,type:'income',category:'اشتراك: '+st.name+' - '+pkg.subject,amount:x.amount,currency:'EGP',date:x.date,note:'فاتورة رقم '+inv+' · '+(x.method||'')+(x.note?' · '+x.note:''),invoiceNumber:inv,createdAt:now});
  }
  saveTransactions(); saveStudents(); markFinDirty(pkg.id); mirrorDirty();
  render(); toast('تم تأكيد الاستلام وتحويله للمالية — الإيصال النهائي من زر 🧾 فاتورة');
}
function cancelPending(pkgId,payId){
  const h=findPkgById(pkgId); if(!h) return; const {pkg}=h;
  const x=(pkg.payments||[]).find(y=>y.id===payId); if(!x||x.status!=='pending'||x.reversed) return;
  if(!confirm('إلغاء هذا المبلغ المؤجل؟ لم يُستلم ولن يدخل المالية.')) return;
  x.reversed=true; x.status='cancelled'; x.reversedAt=new Date().toISOString();
  saveStudents(); markFinDirty(pkg.id); mirrorDirty(); render(); toast('تم إلغاء المبلغ المؤجل');
}
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('[data-pend-confirm],[data-pend-cancel]'); if(!a||!isAdmin()) return;
  if(a.dataset.pendConfirm){ const [pk,py]=a.dataset.pendConfirm.split('|'); confirmPayment(pk,py); }
  else { const [pk,py]=a.dataset.pendCancel.split('|'); cancelPending(pk,py); }
});
function pendingFinanceHtml(){
  if(!isAdmin()) return '';
  const rows=[]; 
  students.forEach(st=>(st.packages||[]).forEach(pk=>(pk.payments||[]).forEach(x=>{ if(!x.reversed&&x.status==='pending') rows.push({st,pk,x}); })));
  if(!rows.length) return '';
  const tot=rows.reduce((a,r)=>a+(Number(r.x.amount)||0),0);
  return `<div class="stats-section" style="margin-bottom:12px;background:#FFF8E6;border:1px solid #E9CE86;border-radius:14px;padding:14px;">
    <div style="font-weight:800;font-size:14px;margin-bottom:4px;">⏳ المالية المؤجلة — بانتظار تأكيد الاستلام</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">${rows.length} مبلغ · الإجمالي بالجنيه: <b>${fmtEGP(tot)}</b> (لا يُحسب في الإيرادات حتى التأكيد)</div>
    ${rows.map(({st,pk,x})=>`<div class="pay-row">
      <b>${escapeHtml(st.name)}</b><span>${escapeHtml(pk.subject)}</span>
      <b>${(x.origCurrency&&x.origCurrency!=='EGP')?escapeHtml(String(x.origAmount))+' '+escapeHtml(x.origCurrency)+' ('+fmtEGP(x.amount)+')':fmtEGP(x.amount)}</b>
      <span>${escapeHtml(x.method||'')}</span><span>${escapeHtml(x.date||'')}</span>${x.note?`<span>${escapeHtml(x.note)}</span>`:''}
      <button class="mini-btn filled" data-pend-confirm="${pk.id}|${x.id}">✅ تأكيد الاستلام</button>
      <button class="mini-btn" data-pend-cancel="${pk.id}|${x.id}" style="color:#B8391A;border-color:#E7C9C9;">إلغاء</button>
    </div>`).join('')}
  </div>`;
}
function reversePayment(st,pkg,payId){
  const x=(pkg.payments||[]).find(y=>y.id===payId); if(!x||x.reversed) return;
  x.reversed=true; x.reversedAt=new Date().toISOString();
  pkg.paid=pkgFin(pkg).status==='paid';
  queueDelete('transactions','pay_'+payId); transactions=transactions.filter(t=>t.id!=='pay_'+payId);
  saveTransactions(); saveStudents(); markFinDirty(pkg.id); mirrorDirty();
}

// ---------- INVOICES (professional numbered invoicing) ----------
function nextInvoiceNumber(){
  let seq=parseInt(localStorage.getItem('amjad_invoice_seq')||'1000',10);
  seq+=1;
  localStorage.setItem('amjad_invoice_seq',String(seq));
  return 'AMJ-'+seq;
}
function generateInvoice(student,pkg,invoiceNumber,pay){
  pay=pay||{amount:Number(pkg.amountEGP)||0};
  const info=getAcademyInfo();
  const teacher=(teachers.find(t=>t.id===pkg.teacherId)||{}).name||'';
  const cur=(pay.origCurrency||pkgCur(pkg)), rate=pkgRate(pkg), foreign=cur!=='EGP';
  const f=pkgFin(pkg);
  const isPend=pay.status==='pending';
  const paidShown=isPend?f.paid+f.pending:f.paid;
  const remShown=isPend?Math.max(f.remaining-f.pending,0):f.remaining;
  const origPaid=pay.origAmount!=null?pay.origAmount:pay.amount;
  const toOrig=v=>foreign?r2(v/rate):r2(v);
  const money=(v)=>Number(v).toLocaleString('en-US',{maximumFractionDigits:2})+' '+cur;
  const egp=(v)=>Number(v).toLocaleString('en-US',{maximumFractionDigits:2})+' EGP';
  const W=1000,H=1080;
  const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  const R=940,L=60;
  ctx.fillStyle='#F8F4E9'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0B1B33'; ctx.fillRect(0,0,W,150);
  ctx.fillStyle='#E9CE86'; ctx.font='bold 32px Tahoma'; ctx.textAlign='right';
  ctx.fillText('أكاديمية أمجاد',R,62);
  ctx.fillStyle='#C9D0DE'; ctx.font='16px Tahoma'; ctx.fillText(isPend?'إيصال مبدئي — بانتظار تأكيد الاستلام':'إيصال استلام دفعة',R,98);
  if(info.phone||info.address){ ctx.font='13px Tahoma'; ctx.direction='ltr'; ctx.textAlign='right'; ctx.fillText([info.phone,info.address].filter(Boolean).join('  ·  '),R,128); ctx.direction='rtl'; }
  ctx.textAlign='left'; ctx.fillStyle='#C9A227'; ctx.font='bold 24px Tahoma'; ctx.fillText(invoiceNumber,L,62);
  ctx.fillStyle='#C9D0DE'; ctx.font='14px Tahoma'; ctx.fillText('تاريخ الدفع: '+(pay.date||dateStr()),L,95);

  let y=205;
  const title=t=>{ ctx.textAlign='right'; ctx.font='bold 21px Tahoma'; ctx.fillStyle='#0B1B33'; ctx.fillText(t,R,y); y+=36; };
  ctx.direction='rtl';
  const line=(label,val,ltr)=>{ if(val===''||val==null) return;
    ctx.font='17px Tahoma'; ctx.fillStyle='#555'; ctx.textAlign='right'; ctx.direction='rtl'; ctx.fillText(label,R,y);
    ctx.fillStyle='#222'; ctx.font='bold 17px Tahoma'; ctx.textAlign='right'; ctx.direction=ltr?'ltr':'rtl'; ctx.fillText(String(val),700,y);
    ctx.direction='rtl'; y+=31; };
  const rule=()=>{ ctx.strokeStyle='#C9A227'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(L,y-8); ctx.lineTo(R,y-8); ctx.stroke(); y+=28; };

  title('بيانات الطالب');
  line('الاسم',student.name); line('ولي الأمر',student.parentName); line('التواصل',student.parentPhone,true);
  rule();
  title('تفاصيل الاشتراك');
  line('المادة / الباقة',pkg.subject); line('المعلم',teacher); line('عدد الحصص',pkg.sessions.length,true);
  line('طريقة الدفع',pay.method); if(pay.note) line('ملاحظة',pay.note);
  rule();
  title('الحساب');
  line('سعر الباقة', foreign?money(toOrig(f.total))+'  ('+egp(f.total)+')':egp(f.total),true);
  if(f.disc) line('الخصم', foreign?money(toOrig(f.disc)):egp(f.disc),true); if(pkg.discountReason) line('سبب الخصم',pkg.discountReason);
  line('إجمالي المدفوع حتى الآن', foreign?money(toOrig(paidShown))+'  ('+egp(paidShown)+')':egp(paidShown),true);
  line('المتبقي', remShown>0?(foreign?money(toOrig(remShown))+'  ('+egp(remShown)+')':egp(remShown)):'لا يوجد', remShown>0);
  rule();

  // الدفعة الحالية بعملة العميل
  ctx.textAlign='center'; ctx.fillStyle=isPend?'#FFF3D6':'#EAF4EE'; ctx.fillRect(L,y-6,R-L,130);
  ctx.fillStyle=isPend?'#9A6A00':'#1F7A4D'; ctx.font='bold 20px Tahoma'; ctx.fillText(isPend?'المبلغ المسجّل (بانتظار التأكيد)':'المبلغ المدفوع في هذا الإيصال',W/2,y+26);
  ctx.direction='ltr'; ctx.font='bold 46px Tahoma'; ctx.fillText(money(origPaid),W/2,y+78);
  if(foreign){ ctx.font='17px Tahoma'; ctx.fillText('≈ '+egp(pay.amount),W/2,y+108); }
  ctx.direction='rtl';
  y+=160;
  ctx.font='bold 20px Tahoma'; ctx.fillStyle=(isPend||remShown>0)?'#9A6A00':'#1F7A4D';

// ---------- DASHBOARD helpers ----------
let statsPeriod='month';
const PERIODS=[['today','اليوم'],['week','آخر 7 أيام'],['month','هذا الشهر'],['year','هذه السنة'],['all','الكل']];
function periodTest(period){
  const now=new Date(); const iso=d=>d.toISOString().slice(0,10); const today=iso(now);
  if(period==='today') return d=>d===today;
  if(period==='week'){ const from=iso(new Date(now.getTime()-6*86400000)); return d=>d>=from&&d<=today; }
  if(period==='month'){ const m=today.slice(0,7); return d=>d.startsWith(m); }
  if(period==='year'){ const y=today.slice(0,4); return d=>d.startsWith(y); }
  return ()=>true;
}
function statsAlertsHtml(){
  const owing=[], expiring=[], noPrice=[]; let pendTotal=0, pendCount=0, owedTotal=0;
  students.forEach(st=>(st.packages||[]).forEach(pk=>{
    const f=pkgFin(pk);
    (pk.payments||[]).forEach(x=>{ if(!x.reversed&&x.status==='pending'){ pendTotal+=Number(x.amount)||0; pendCount++; } });
    if(pk.active!==false){
      if(f.net>0&&f.remaining>0){ owing.push({st,pk,f}); owedTotal+=f.remaining; }
      if(f.net<=0&&!pk.paid) noPrice.push({st,pk});
      const left=(pk.sessions||[]).filter(ss=>!ss.status||ss.status==='pending').length;
      if(left>0&&left<=2) expiring.push({st,pk,left});
    }
  }));
  owing.sort((a,b)=>b.f.remaining-a.f.remaining);
  const box=(bg,bd,title,body)=>`<div class="stats-section" style="background:${bg};border:1px solid ${bd};border-radius:14px;padding:14px;margin-bottom:12px;"><div style="font-weight:800;font-size:14px;margin-bottom:6px;">${title}</div>${body}</div>`;

// ---------- XLSX export (no external library) ----------
const _crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function _crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=_crcT[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){ // files: [{name,data:Uint8Array}]
  const enc=new TextEncoder(); const chunks=[]; const central=[]; let offset=0;
  const w16=(a,v)=>a.push(v&255,(v>>8)&255), w32=(a,v)=>a.push(v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255);
  files.forEach(f=>{
    const name=enc.encode(f.name), crc=_crc32(f.data), size=f.data.length;
    const h=[]; w32(h,0x04034b50); w16(h,20); w16(h,0x0800); w16(h,0); w16(h,0); w16(h,0x21); w32(h,crc); w32(h,size); w32(h,size); w16(h,name.length); w16(h,0);
    chunks.push(new Uint8Array(h),name,f.data);
    const c=[]; w32(c,0x02014b50); w16(c,20); w16(c,20); w16(c,0x0800); w16(c,0); w16(c,0); w16(c,0x21); w32(c,crc); w32(c,size); w32(c,size); w16(c,name.length); w16(c,0); w16(c,0); w16(c,0); w16(c,0); w32(c,0); w32(c,offset);
    central.push(new Uint8Array(c),name);
    offset+=h.length+name.length+size;
  });
  let csize=0; central.forEach(x=>csize+=x.length);
  const e=[]; w32(e,0x06054b50); w16(e,0); w16(e,0); w16(e,files.length); w16(e,files.length); w32(e,csize); w32(e,offset); w16(e,0);
  return new Blob([...chunks,...central,new Uint8Array(e)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function _xe(v){ return String(v).replace(/[<>&"']/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[m])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,''); }
function _col(i){ let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s; }
function buildXlsx(sheets){
  const enc=new TextEncoder(); const u=t=>enc.encode(t);
  const files=[];
  files.push({name:'[Content_Types].xml',data:u('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>')});
  files.push({name:'_rels/.rels',data:u('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
  files.push({name:'xl/workbook.xml',data:u('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((sh,i)=>'<sheet name="'+_xe(sh.name.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>')});
  files.push({name:'xl/_rels/workbook.xml.rels',data:u('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>')});
  files.push({name:'xl/styles.xml',data:u('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF0EADA"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>')});
  sheets.forEach((sh,i)=>{
    const ncols=Math.max(1,...sh.rows.map(r=>r.length));
    let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><cols>';
    for(let c=0;c<ncols;c++) x+='<col min="'+(c+1)+'" max="'+(c+1)+'" width="'+(sh.widths&&sh.widths[c]||20)+'" customWidth="1"/>';
    x+='</cols><sheetData>';
    sh.rows.forEach((row,r)=>{
      x+='<row r="'+(r+1)+'">';
      row.forEach((v,c)=>{
        if(v===null||v===undefined||v==='') return;
        const ref=_col(c)+(r+1), st=(r===0&&!sh.noHeader)?' s="1"':'';
        if(typeof v==='number'&&isFinite(v)) x+='<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
        else x+='<c r="'+ref+'" t="inlineStr"'+st+'><is><t xml:space="preserve">'+_xe(v)+'</t></is></c>';
      });
      x+='</row>';
    });
    x+='</sheetData></worksheet>';
    files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:u(x)});
  });
  return zipStore(files);
}

function financeReportData(){
  const payRows=[['الطالب','المادة','التاريخ','طريقة الدفع','المبلغ (عملة العميل)','العملة','المعادل (ج.م)','الحالة','رقم الإيصال','ملاحظة']];
  const owingRows=[['الطالب','المادة','السعر (ج.م)','الخصم (ج.م)','مؤكد (ج.م)','مؤجل (ج.م)','المتبقي (ج.م)','الحالة']];
  let owedTotal=0,pendTotal=0;
  students.forEach(st=>(st.packages||[]).forEach(pk=>{
    const f=pkgFin(pk);
    if(Array.isArray(pk.payments)) pk.payments.forEach(x=>{
      const stt=x.reversed?(x.status==='cancelled'?'ملغاة (كانت مؤجلة)':'ملغاة'):x.status==='pending'?'مؤجلة':'مؤكدة';
      payRows.push([st.name,pk.subject,x.date||'',x.method||'',Number(x.origAmount!=null?x.origAmount:x.amount)||0,x.origCurrency||'EGP',Number(x.amount)||0,stt,x.invoiceNumber||'',x.note||'']);
    });
    else if(pk.paid) payRows.push([st.name,pk.subject,'','(قبل نظام الدفعات)',Number(pk.amount)||0,pk.currency||'EGP',Number(pk.amountEGP)||0,'مؤكدة (قديمة)','','']);
    if(pk.active!==false){
      owedTotal+=f.remaining; pendTotal+=f.pending;
      if(f.remaining>0||f.pending>0||f.net<=0) owingRows.push([st.name,pk.subject,f.total,f.disc,f.paid,f.pending,f.remaining,f.net<=0?'بدون سعر':f.status==='paid'?'مدفوع':f.status==='partial'?'جزئي':'غير مدفوع']);
    }
  }));
  const txRows=[['رقم الفاتورة','التاريخ','النوع','البند','المبلغ','العملة','ملاحظة']];
  [...transactions].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(t=>txRows.push([t.invoiceNumber||'',t.date||'',t.type==='income'?'إيراد':t.type==='expense'?'مصروف':'إعلان',t.category||'',Number(t.amount)||0,t.currency||'EGP',t.note||'']));
  const byCur={}; transactions.forEach(t=>{ const c=t.currency||'EGP'; if(!byCur[c])byCur[c]={income:0,expense:0,ad:0}; byCur[c][t.type]=(byCur[c][t.type]||0)+(Number(t.amount)||0); });
  const sumRows=[['العملة','الإيرادات','المصروفات','الإعلانات','الصافي']];
  Object.keys(byCur).forEach(c=>{ const d=byCur[c]; sumRows.push([c,d.income,d.expense,d.ad,d.income-d.expense-d.ad]); });
  sumRows.push([],['إجمالي المتأخرات (ج.م)',owedTotal],['إجمالي المالية المؤجلة (ج.م)',pendTotal],['تاريخ التقرير',dateStr()]);
  return {payRows,owingRows,txRows,sumRows,owedTotal,pendTotal,byCur};
}

  if(!isAdmin()) return;
  document.getElementById('settingsMenuRoot').innerHTML='';
  const d=financeReportData();
  const blob=buildXlsx([
    {name:'الملخص',rows:d.sumRows,widths:[30,16,16,16,16]},
    {name:'المتأخرات',rows:d.owingRows,widths:[22,18,14,14,14,14,14,14]},
    {name:'الدفعات',rows:d.payRows,widths:[22,18,13,16,18,10,14,18,14,24]},
    {name:'المعاملات',rows:d.txRows,widths:[14,13,10,34,14,10,30]}
  ]);
  downloadBlob(blob,'amjad-finance-'+dateStr()+'.xlsx'); toast('تم تصدير التقرير المالي Excel');
}

function exportBackup(){
  const backup={students,transactions,teachers,bookings,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`amjad-backup-${dateStr()}.json`; a.click(); URL.revokeObjectURL(url);
  document.getElementById('settingsMenuRoot').innerHTML=''; toast('تم تنزيل النسخة الاحتياطية');
}
document.getElementById('importFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=evt=>{
    try{
      const data=JSON.parse(evt.target.result);
      if(Array.isArray(data.students)){
        students=data.students.map(migrateStudent);
        transactions=Array.isArray(data.transactions)?data.transactions:[];
        teachers=Array.isArray(data.teachers)?data.teachers:[];
        bookings=Array.isArray(data.bookings)?data.bookings:[];
        saveStudents(); saveTransactions(); saveTeachers(); saveBookings(); render(); toast('تم الاستيراد');
      } else alert('ملف غير صالح');
    }catch(err){ alert('تعذر قراءة الملف'); }
  };
  reader.readAsText(file);
  document.getElementById('settingsMenuRoot').innerHTML=''; e.target.value='';
});

function fireNotification(title,body){
  if('Notification' in window && Notification.permission==='granted'){
    if(navigator.serviceWorker && navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body,icon:'icon-192.png',dir:'rtl'}));
    } else { new Notification(title,{body,icon:'icon-192.png'}); }
  }
}

// ---------- Login (Supabase Auth + profiles role) ----------
let currentUser = null; // {id, email, role, full_name}
function isAdmin(){ return !!(currentUser && currentUser.role==='admin'); }
function applyRoleUI(){
  const financeBtn = document.querySelector('.tabs .tab-btn[data-tab="finance"]');
  if(financeBtn) financeBtn.style.display = isAdmin() ? '' : 'none';
  if(!isAdmin() && (currentTab==='finance' || currentTab==='stats' || currentTab==='supervisors')) currentTab='today';
}

async function loadCurrentUserProfile(){
  const { data: sessionData } = await supabaseClient.auth.getSession();
  const user = sessionData && sessionData.session ? sessionData.session.user : null;
  if(!user) return false;
  const { data: profile, error } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
  if(error || !profile || !profile.active) return false;
  currentUser = { id: user.id, email: user.email, role: profile.role, full_name: profile.full_name };
  // If this device previously had a different account's data cached locally, wipe it so a lower-privilege
  // user never renders another account's stale cached data (e.g. a supervisor seeing an admin's cached finances).
  const lastUid = localStorage.getItem('amjad_last_uid');
  if(lastUid !== currentUser.id){
    localStorage.removeItem('amjad_students');
    localStorage.removeItem('amjad_transactions');
    localStorage.removeItem('amjad_teachers');
    localStorage.removeItem('amjad_bookings');
    students=[]; transactions=[]; teachers=[]; bookings=[];
    localStorage.setItem('amjad_last_uid', currentUser.id);
  }
  return true;
}

async function tryLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassInput').value;
  const errBox = document.getElementById('lockError');
  errBox.style.display='none';
  if(!email || !password){ errBox.textContent='من فضلك اكتب الإيميل وكلمة السر'; errBox.style.display='block'; return; }
  if(!supabaseClient){ errBox.textContent='تعذر الاتصال — جرب تاني'; errBox.style.display='block'; return; }
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    errBox.textContent='الإيميل أو كلمة السر غلط';
    errBox.style.display='block';
    document.getElementById('loginPassInput').value='';
    return;
  }
  const ok = await loadCurrentUserProfile();
  if(!ok){
    errBox.textContent='الحساب ده لسه مش مفعّل — كلم المدير العام';
    errBox.style.display='block';
    await supabaseClient.auth.signOut();
    return;
  }
  document.getElementById('lockScreen').style.display='none';
  startApp();
}
document.getElementById('loginSubmitBtn').addEventListener('click', tryLogin);
document.getElementById('loginPassInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });

function startApp(){
  render();
  loadFromCloud();
  setInterval(pollNewBookings, 45000);
}

async function pollNewBookings(){
  if(!supabaseClient) return;
  try{
    const {data,error} = await supabaseClient.from('bookings').select('*');
    if(error || !data) return;
    const newPending = data.filter(b=>b.status==='pending' && !seenBookingIds.has(b.id));
    if(newPending.length){
      newPending.forEach(b=>{
        fireNotification('📅 حجز جديد!', `${b.name} — ${b.subject||''} (${b.preferred_day||''} ${b.preferred_time||''})`);
        seenBookingIds.add(b.id);
      });
      localStorage.setItem('amjad_seen_bookings', JSON.stringify([...seenBookingIds]));
    }
    bookings = data;
    localStorage.setItem('amjad_bookings', JSON.stringify(bookings));
    if(currentView!=='profile'){
      const bkBtn = document.getElementById('bookingsTabBtn');
      const pendingCount = bookings.filter(b=>b.status==='pending').length;
      if(bkBtn) bkBtn.innerHTML = `📅 الحجوزات${pendingCount>0?` <span style="background:#B8391A;color:#fff;border-radius:10px;padding:1px 6px;font-size:10.5px;">${pendingCount}</span>`:''}`;
      if(currentTab==='bookings') render();
    }
  }catch(e){ console.error('poll bookings failed', e); }
}

(async function initAuthGate(){
  if(!supabaseClient){ document.getElementById('loginEmail').focus(); return; }
  const ok = await loadCurrentUserProfile();
  if(ok){
    document.getElementById('lockScreen').style.display='none';
    startApp();
  } else {
    document.getElementById('loginEmail').focus();
  }
})();
