const BK_LABELS={students:'الطلاب',teachers:'المعلمين',transactions:'المعاملات',bookings:'الحجوزات',subscriptions:'الاشتراكات',subscription_sessions:'الحصص',subscription_finance:'مالية الاشتراكات',payments:'الدفعات',supervisor_students:'تعيين المشرفين'};
function bkFmtDate(iso){ try{ return new Date(iso).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return iso; } }
function bkSummary(res){ return Object.keys(res||{}).map(k=>(BK_LABELS[k]||k)+': '+res[k]).join(' · '); }

async function refreshBackupsList(note){

  body.innerHTML=`
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">تؤخذ نسخة تلقائية يوميًا (تُحفظ آخر 7 أيام)، والنسخ اليدوية تُحفظ دائمًا. الاسترجاع <b>يضيف الناقص فقط</b> ولا يعدّل ولا يمسح أي شيء موجود.</div>

      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">${escapeHtml(bkSummary(b.counts))}</div>
      <button class="mini-btn" data-bk-dl="${b.id}">⬇️ تحميل JSON</button>
      <button class="mini-btn" data-bk-prev="${b.id}">🔍 معاينة الاسترجاع</button>
      <button class="mini-btn" data-bk-rest="${b.id}" style="color:#9A6A00;">♻️ استرجاع الناقص</button>
    </div>`).join('')||'<div class="empty" style="padding:14px;">لا توجد نسخ بعد</div>'}</div>`;
  document.getElementById('bkNow').addEventListener('click',async e=>{
    e.target.disabled=true; const {data:id,error:er}=await supabaseClient.rpc('take_backup',{p_kind:'manual'});
    await refreshBackupsList(er?('تعذّر أخذ النسخة: '+escapeHtml(er.message||String(er))):('✅ تم أخذ نسخة جديدة #'+id));
  });
  body.querySelectorAll('[data-bk-dl]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true; const {data:row,error:er}=await supabaseClient.from('backups').select('data,created_at').eq('id',b.dataset.bkDl).single(); b.disabled=false;
    if(er||!row){ toast('تعذّر تحميل النسخة'); return; }
    downloadBlob(new Blob([JSON.stringify(row.data)],{type:'application/json'}),'amjad-backup-'+b.dataset.bkDl+'-'+String(row.created_at).slice(0,10)+'.json'); toast('تم تحميل النسخة');
  }));
  body.querySelectorAll('[data-bk-prev]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true; const {data:r,error:er}=await supabaseClient.rpc('restore_from_backup',{p_id:Number(b.dataset.bkPrev),p_dry_run:true}); b.disabled=false;
    const total=r&&r.rows_missing_or_restored?Object.values(r.rows_missing_or_restored).reduce((a,v)=>a+v,0):0;
    await refreshBackupsList(er?('تعذّرت المعاينة: '+escapeHtml(er.message||String(er))):(total?('🔍 معاينة #'+b.dataset.bkPrev+': سيُضاف '+total+' صف ناقص — '+escapeHtml(bkSummary(r.rows_missing_or_restored))):('🔍 معاينة #'+b.dataset.bkPrev+': لا يوجد شيء ناقص، كل بيانات النسخة موجودة.')));
  }));
  body.querySelectorAll('[data-bk-rest]').forEach(b=>b.addEventListener('click',async()=>{
    const id=Number(b.dataset.bkRest);
    const {data:pre,error:e1}=await supabaseClient.rpc('restore_from_backup',{p_id:id,p_dry_run:true});
    if(e1){ await refreshBackupsList('تعذّرت المعاينة: '+escapeHtml(e1.message||String(e1))); return; }
    const total=Object.values(pre.rows_missing_or_restored||{}).reduce((a,v)=>a+v,0);
    if(!total){ await refreshBackupsList('♻️ لا يوجد شيء ناقص للاسترجاع من النسخة #'+id); return; }

    const {data:r,error:e2}=await supabaseClient.rpc('restore_from_backup',{p_id:id,p_dry_run:false});
    if(e2){ await refreshBackupsList('تعذّر الاسترجاع: '+escapeHtml(e2.message||String(e2))); return; }
    try{ await loadFromCloud(); }catch(e){}
    await refreshBackupsList('✅ تم استرجاع: '+escapeHtml(bkSummary(r.rows_missing_or_restored))+' (أُخذت نسخة أمان قبل الاسترجاع)');
  }));

function regFiltered(){

    if(s.family&&(r.family_code||'—')!==s.family) return false;
    if(s.teacher&&(r.teacher_name||'—')!==s.teacher) return false;
    if(s.subject&&r.subject!==s.subject) return false;
    if(s.pkg&&r.package_status!==s.pkg) return false;
    if(s.pay&&r.pay_status!==s.pay) return false;
    if(s.country&&(r.country||'—')!==s.country) return false;
    if(s.from&&!(r.start_date&&r.start_date>=s.from)) return false;
    if(s.to&&!(r.start_date&&r.start_date<=s.to)) return false;
    return true;
  });

function regTotals(rows){

function regExport(kind){
  const rows=regFiltered(), adm=isAdmin(), t=regTotals(rows), cols=regCols();
  if(!rows.length){ toast('لا توجد بيانات للتصدير'); return; }
  const sheets=[];
  const stOf=v=>({'مدفوعة بالكامل':4,'مدفوعة جزئيًا':3,'غير مدفوعة':2,'متأخرة':10,'مستردة':12}[v]);
  if(kind==='all'){
    const head=cols.map(c=>c.l);
    const body=rows.map(r=>cols.map(c=>{
      const v=r[c.k];
      if(c.k==='pay_status') return {v:v||'',s:stOf(v)!=null?stOf(v):0};
      if(c.money) return v==null?'':{v:regNum(v),s:13};
      if(c.num) return v==null?'':(c.egp?{v:regNum(v),s:13}:regNum(v));
      return v==null?'':String(v);
    }));
    const sumKeys=['total_sessions','attended','remaining_sessions','total_egp','discount_egp','net_egp','paid_egp','remaining_egp'];
    const tot=cols.map((c,i)=>{ if(i===0) return {v:'الإجمالي',s:5}; if(sumKeys.includes(c.k)){ const sm=rows.reduce((a,r)=>a+regNum(r[c.k]),0); return {v:Math.round(sm*100)/100,s:14}; } return ''; });
    sheets.push({name:'سجل الاشتراكات',rows:[head].concat(body,[tot]),widths:cols.map(c=>Math.round(c.w/6.5)),freeze:true,filter:true});
    const sm=[['البند','القيمة'],['عدد الأسر',t.families],['عدد الطلاب',t.students],['عدد الاشتراكات',t.subs]];
    if(adm){ sm.push(['إجمالي قيمة الباقات (ج.م)',Math.round(t.net*100)/100],['المحصّل (ج.م)',Math.round(t.paid*100)/100],['المتبقي (ج.م)',Math.round(t.rem*100)/100],['مستحقات المعلمين',regCurMap(t.due)],['المصروف للمعلمين',regCurMap(t.tpaid)],['غير المصروف للمعلمين',regCurMap(regUnpaidMap(t))]); }
    sm.push(['تاريخ التقرير',dateStr()]);
    sheets.push({name:'الملخص',rows:sm,widths:[34,30]});
  }
  if(adm){
    const g={}; rows.forEach(r=>{ if(!r.teacher_name) return; if(!r.teacher_due_currency&&!regNum(r.teacher_due)&&!regNum(r.teacher_paid)) return; const cur=r.teacher_due_currency||'EGP', k=r.teacher_name+'|'+cur; const o=(g[k]=g[k]||{n:r.teacher_name,cur,subs:0,due:0,paid:0}); o.subs++; o.due+=regNum(r.teacher_due); o.paid+=regNum(r.teacher_paid); });
    const list=Object.values(g).sort((a,b)=>a.n.localeCompare(b.n,'ar'));
    const trows=[['المعلم','العملة','عدد الاشتراكات','المستحق','المصروف','المتبقي']].concat(list.map(o=>[o.n,o.cur,o.subs,{v:Math.round(o.due*100)/100,s:13},{v:Math.round(o.paid*100)/100,s:13},{v:Math.round((o.due-o.paid)*100)/100,s:13}]));
    trows.push([{v:'الإجمالي',s:5},'',{v:list.reduce((a,o)=>a+o.subs,0),s:14},'','','']);
    sheets.push({name:'مستحقات المعلمين',rows:trows,widths:[26,10,14,16,16,16],freeze:true,filter:true});
  }
  if(kind==='teachers') sheets.splice(0,sheets.length-1);
  downloadBlob(buildXlsx(sheets),'amjad-'+(kind==='teachers'?'teacher-dues':'register')+'-'+dateStr()+'.xlsx');
  toast('تم تصدير Excel ('+rows.length+' اشتراك)');
}

// ---------- REGISTRATION WIZARD: family -> student -> package (admin) ----------
function pmGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}'); }catch(e){ return {}; } }
function pmSet(k,o){ try{ localStorage.setItem(k,JSON.stringify(o)); }catch(e){} }
function queueStudentMeta(id,meta){ const o=pmGet('amjad_pending_meta'); o[id]=Object.assign(o[id]||{},meta); pmSet('amjad_pending_meta',o); }
async function flushStudentMeta(){
  if(!supabaseClient||!isAdmin()) return;
  const o=pmGet('amjad_pending_meta'); const ids=Object.keys(o); if(!ids.length) return;
  for(const id of ids){
    const s=students.find(x=>x.id===id); if(!s){ delete o[id]; continue; }
    try{
      const c=Object.assign({},s); delete c.family_id; delete c.stage; delete c.grade;
      let r=await supabaseClient.from('students').upsert([c],{onConflict:'id'}); if(r.error) throw r.error;
      r=await supabaseClient.from('students').update(o[id]).eq('id',id).select('id'); if(r.error) throw r.error;
      if(r.data&&r.data.length) delete o[id];
    }catch(e){ console.error('student meta flush failed',id,e); }
  }
  pmSet('amjad_pending_meta',o);
}
function queuePkgRates(pid,r){ const o=pmGet('amjad_pending_rates'); o[pid]=Object.assign(o[pid]||{},r); pmSet('amjad_pending_rates',o); }
async function flushPkgRates(){
  if(!supabaseClient||!isAdmin()) return;
  const o=pmGet('amjad_pending_rates'); const ids=Object.keys(o); if(!ids.length) return;
  for(const id of ids){
    const f=findPkgById(id); if(!f){ delete o[id]; continue; }
    try{
      await mirrorPackage(f.st,f.pkg);
      const r=await supabaseClient.from('subscription_finance').update(o[id]).eq('subscription_id',id).select('subscription_id'); if(r.error) throw r.error;
      if(r.data&&r.data.length) delete o[id];
    }catch(e){ console.error('rates flush failed',id,e); }
  }
  pmSet('amjad_pending_rates',o);
}

const FAM_TZ={'السعودية':'Asia/Riyadh','الإمارات':'Asia/Dubai','قطر':'Asia/Qatar','الكويت':'Asia/Kuwait','عُمان':'Asia/Muscat','البحرين':'Asia/Bahrain','مصر':'Africa/Cairo'};
const famState={list:[],guardians:[],kids:[],q:'',openId:null};
async function famLoad(){
  const [f,g,s]=await Promise.all([
    supabaseClient.from('families').select('*').is('deleted_at',null).order('family_code'),
    supabaseClient.from('guardians').select('*').is('deleted_at',null),
    supabaseClient.from('students').select('id,name,family_id').is('deleted_at',null)
  ]);
  const err=f.error||g.error||s.error; if(err) throw err;
  famState.list=f.data||[]; famState.guardians=g.data||[]; famState.kids=s.data||[];
}
function famKidsOf(id){ return famState.kids.filter(k=>k.family_id===id); }
function famGuardiansOf(id){ return famState.guardians.filter(g=>g.family_id===id); }
function famPrimary(id){ const gs=famGuardiansOf(id); return gs.find(g=>g.is_primary)||gs[0]||null; }
async function openFamiliesModal(openId){
  if(!isAdmin()||!supabaseClient) return;

  document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeForm();});
  document.getElementById('closeModal').addEventListener('click',closeForm);
  famState.openId=(typeof openId==='string')?openId:null; famState.q='';
  await famRefresh();
}
async function famRefresh(note){
  const body=document.getElementById('famBody'); if(!body) return;
  try{ await famLoad(); }catch(e){ body.innerHTML='تعذّر التحميل: '+escapeHtml(e.message||String(e)); return; }

  else { famState.openId=null; famRenderList(body,note); }

function famListHtml(){
  const q=famState.q.trim().toLowerCase();
  const rows=famState.list.filter(f=>{
    if(!q) return true;
    const kids=famKidsOf(f.id).map(k=>k.name).join(' ');
    const gs=famGuardiansOf(f.id).map(g=>(g.full_name||'')+' '+(g.phone||'')).join(' ');
    return ((f.family_name||'')+' '+(f.family_code||'')+' '+kids+' '+gs).toLowerCase().includes(q);
  });
  return rows.map(f=>{
    const kids=famKidsOf(f.id), g=famPrimary(f.id);
    return `<div class="fin-box" data-fam="${escapeHtml(f.id)}" style="cursor:pointer;">

      ${g?`<div style="font-size:11.5px;color:var(--muted);">👤 ${escapeHtml(g.relation||'ولي الأمر')} ${g.phone?'· <span dir="ltr">'+escapeHtml(g.phone)+'</span>':''}</div>`:''}
    </div>`;
  }).join('')||'<div class="empty" style="padding:14px;">لا توجد نتائج</div>';
}

function famRenderDetail(body,note){

    <button class="mini-btn" id="famBack">← كل الأسر</button>

      <textarea class="field-input" id="fam_notes" style="min-height:50px;">${escapeHtml(f.notes||'')}</textarea>
      <button class="submit-btn" id="famSave" style="margin-top:10px;">حفظ بيانات الأسرة</button>
    </div>
    <div style="font-weight:800;margin:12px 0 4px;">👤 أولياء الأمور</div>
    ${gs.map(g=>`<div class="fin-box" data-g="${escapeHtml(g.id)}">
      <label class="field-label" style="margin-top:0;">الاسم</label><input class="field-input g_name" value="${escapeHtml(g.full_name||'')}">
      <label class="field-label">الصلة (والد / والدة …)</label><input class="field-input g_rel" value="${escapeHtml(g.relation||'')}">

  });
  body.querySelectorAll('.k_unlink').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('فك ربط هذا الطالب بالأسرة؟ (لا يُحذف الطالب ولا بياناته)')) return;

  document.getElementById('famLink').addEventListener('click',async()=>{
    const sid=document.getElementById('famFree').value; if(!sid){ toast('اختر طالبًا أولًا'); return; }
    const {error}=await supabaseClient.from('students').update({family_id:f.id}).eq('id',sid);

  });
}

document.getElementById('importFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=evt=>{
    try{
      const data=JSON.parse(evt.target.result);
      if(Array.isArray(data.students)){
        students=data.students.map(migrateStudent);
        transactions=Array.isArray(data.transactions)?data.transactions:[];
        teachers=Array.isArray(data.teachers)?data.teachers:[];
        bookings=Array.isArray(data.bookings)?data.bookings:[];
        saveStudents(); saveTransactions(); saveTeachers(); saveBookings(); render(); toast('تم الاستيراد');
      } else alert('ملف غير صالح');
    }catch(err){ alert('تعذر قراءة الملف'); }
  };
  reader.readAsText(file);
  document.getElementById('settingsMenuRoot').innerHTML=''; e.target.value='';
});

function fireNotification(title,body){
  if('Notification' in window && Notification.permission==='granted'){
    if(navigator.serviceWorker && navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body,icon:'icon-192.png',dir:'rtl'}));
    } else { new Notification(title,{body,icon:'icon-192.png'}); }
  }
}

// ---------- Login (Supabase Auth + profiles role) ----------
let currentUser = null; // {id, email, role, full_name}
function isAdmin(){ return !!(currentUser && currentUser.role==='admin'); }
function applyRoleUI(){
  const financeBtn = document.querySelector('.tabs .tab-btn[data-tab="finance"]');
  if(financeBtn) financeBtn.style.display = isAdmin() ? '' : 'none';
  if(!isAdmin() && (currentTab==='finance' || currentTab==='stats' || currentTab==='supervisors')) currentTab='today';
}

async function loadCurrentUserProfile(){
  const { data: sessionData } = await supabaseClient.auth.getSession();
  const user = sessionData && sessionData.session ? sessionData.session.user : null;
  if(!user) return false;
  const { data: profile, error } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
  if(error || !profile || !profile.active) return false;
  currentUser = { id: user.id, email: user.email, role: profile.role, full_name: profile.full_name };
  // If this device previously had a different account's data cached locally, wipe it so a lower-privilege
  // user never renders another account's stale cached data (e.g. a supervisor seeing an admin's cached finances).
  const lastUid = localStorage.getItem('amjad_last_uid');
  if(lastUid !== currentUser.id){
    localStorage.removeItem('amjad_students');
    localStorage.removeItem('amjad_transactions');
    localStorage.removeItem('amjad_teachers');
    localStorage.removeItem('amjad_bookings');
    students=[]; transactions=[]; teachers=[]; bookings=[];
    localStorage.setItem('amjad_last_uid', currentUser.id);
  }
  return true;
}

async function tryLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassInput').value;
  const errBox = document.getElementById('lockError');
  errBox.style.display='none';
  if(!email || !password){ errBox.textContent='من فضلك اكتب الإيميل وكلمة السر'; errBox.style.display='block'; return; }
  if(!supabaseClient){ errBox.textContent='تعذر الاتصال — جرب تاني'; errBox.style.display='block'; return; }
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    errBox.textContent='الإيميل أو كلمة السر غلط';
    errBox.style.display='block';
    document.getElementById('loginPassInput').value='';
    return;
  }
  const ok = await loadCurrentUserProfile();
  if(!ok){
    errBox.textContent='الحساب ده لسه مش مفعّل — كلم المدير العام';
    errBox.style.display='block';
    await supabaseClient.auth.signOut();
    return;
  }
  document.getElementById('lockScreen').style.display='none';
  startApp();
}
document.getElementById('loginSubmitBtn').addEventListener('click', tryLogin);
document.getElementById('loginPassInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });

function startApp(){
  render();
  loadFromCloud();
  setInterval(pollNewBookings, 45000);
}

async function pollNewBookings(){
  if(!supabaseClient) return;
  try{
    const {data,error} = await supabaseClient.from('bookings').select('*');
    if(error || !data) return;
    const newPending = data.filter(b=>b.status==='pending' && !seenBookingIds.has(b.id));
    if(newPending.length){
      newPending.forEach(b=>{
        fireNotification('📅 حجز جديد!', `${b.name} — ${b.subject||''} (${b.preferred_day||''} ${b.preferred_time||''})`);
        seenBookingIds.add(b.id);
      });
      localStorage.setItem('amjad_seen_bookings', JSON.stringify([...seenBookingIds]));
    }
    bookings = data;
    localStorage.setItem('amjad_bookings', JSON.stringify(bookings));
    if(currentView!=='profile'){
      const bkBtn = document.getElementById('bookingsTabBtn');
      const pendingCount = bookings.filter(b=>b.status==='pending').length;
      if(bkBtn) bkBtn.innerHTML = `📅 الحجوزات${pendingCount>0?` <span style="background:#B8391A;color:#fff;border-radius:10px;padding:1px 6px;font-size:10.5px;">${pendingCount}</span>`:''}`;
      if(currentTab==='bookings') render();
    }
  }catch(e){ console.error('poll bookings failed', e); }
}

(async function initAuthGate(){
  if(!supabaseClient){ document.getElementById('loginEmail').focus(); return; }
  const ok = await loadCurrentUserProfile();
  if(ok){
    document.getElementById('lockScreen').style.display='none';
    startApp();
  } else {
    document.getElementById('loginEmail').focus();
  }
})();
